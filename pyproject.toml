[project]
name = "cartograph-mcp"
version = "0.1.0"
description = "Agent-native code intelligence: turn any repo into a queryable code graph over MCP. tree-sitter + SQLite, no embeddings, no API keys."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gokul Raj" }]
keywords = ["mcp", "model-context-protocol", "tree-sitter", "code-graph", "static-analysis", "ai-agents", "code-intelligence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "mcp>=2.0.0",
  "rich>=13.7",
  "tree-sitter>=0.25",
  "tree-sitter-language-pack>=1.0",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/GokulRaj2210/cartograph-mcp"
Repository = "https://github.com/GokulRaj2210/cartograph-mcp"
Issues = "https://github.com/GokulRaj2210/cartograph-mcp/issues"

[project.scripts]
cartograph = "cartograph.cli:app"
cartograph-mcp-server = "cartograph.mcp_server.server:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartograph"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "C4", "PTH", "RET"]
ignore = [
  "B008",    # typer declares option defaults as function calls by design
  "RUF001",  # en dashes in rendered Markdown are deliberate typography
]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/**" = ["ALL"]

[tool.mypy]
python_version = "3.11"
files = ["src/cartograph"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tree_sitter_language_pack.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures/sample_repo contains its own tests/test_core.py, which is index
# fodder, not a test of this project. Keep pytest out of it.
norecursedirs = ["fixtures"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["cartograph"]
